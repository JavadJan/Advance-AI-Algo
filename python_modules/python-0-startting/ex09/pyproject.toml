[project]
name = "ft_package"
version = "0.0.1"
description = "A sample test package"
authors = [
    {name = "mkhavari", email = "mkhavari@42.fr"}
]
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.8"

# ✔ Correct way to define homepage
urls = { Homepage = "https://github.com/javadjan" }

classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent"
]

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"
